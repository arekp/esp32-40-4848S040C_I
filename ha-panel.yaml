    - id: settings_page
      bg_color: 0x0F1424
      widgets:
        - label:
            align: TOP_MID
            y: 40
            text_font: font_name
            text_color: 0xE8EDFA
            text: "Jasnosc ekranu"

        - slider:
            id: brightness_slider
            align: TOP_MID
            y: 100
            width: 380
            height: 14
            value: 100
            min_value: 5
            max_value: 100
            bg_color: 0x2C3858
            indicator:
              bg_color: 0x4FC3F7
            knob:
              bg_color: 0xE8EDFA
            on_value:
              - light.turn_on:
                  id: display_backlight
                  brightness: !lambda 'return x / 100.0;'

        - label:
            align: TOP_LEFT
            x: 50
            y: 170
            text_font: font_name
            text_color: 0xE8EDFA
            text: "Wygaszacz (zegar nocny)"

        - switch:
            id: screensaver_switch
            align: TOP_RIGHT
            x: -50
            y: 166
            width: 64
            height: 32
            state:
              checked: true
            bg_color: 0x2C3858
            indicator:
              bg_color: 0x2C3858
            on_value:
              - lambda: 'id(screensaver_on) = x;'

        - label:
            id: ip_label
            align: CENTER
            y: 60
            text_font: font_nav
            text_color: 0x7C88A8
            text: "IP: ..."

        - label:
            align: CENTER
            y: 90
            text_font: font_nav
            text_color: 0x56608A
            text: "HA Panel Rybki v4.0"
