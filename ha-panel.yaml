substitutions:
  device_name: ha-panel
  # --- encje HA do strony glownej (zmien na wlasne) ---
  salon_player: media_player.onkyo_2
  sypialnia_player: media_player.sypialnia
  weather_entity: weather.forecast_dom
  # --- zakres docelowy temperatury terrarium [C] (status na zegarze i wskaznik) ---
  terrarium_temp_min: "22.0"
  terrarium_temp_max: "32.0"

esphome:
  name: ${device_name}
  friendly_name: HA Panel Rybki
  min_version: "2024.6.0"
  on_boot:
    priority: -100
    then:
      - script.execute: update_clock

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

debug:
  update_interval: 30s

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        - light.turn_off:
            id: display_backlight
            transition_length: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    then:
      - lvgl.label.update:
          id: ip_label
          text: !lambda 'return "IP: " + id(wifi_ip).state;'
  ap:
    ssid: "HA-Panel"
    password: !secret ap_fallback_password

captive_portal:

globals:
  - id: screensaver_on
    type: bool
    initial_value: "true"

# ---------- CZAS ----------
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

# ---------- SPI / I2C / BACKLIGHT ----------
spi:
  clk_pin: GPIO48
  mosi_pin: GPIO47

i2c:
  sda: GPIO19
  scl:
    number: GPIO45
    ignore_strapping_warning: true
  frequency: 400kHz

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    name: Backlight
    id: display_backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

# ============================================================
# MAPOWANIE (potwierdzone przez uzytkownika):
#   Salon     = switch.gnizdo_rybki_salon
#   Sypialnia = switch.gniazdo16w
#   Kuchnia   = switch.gniazdo20w
# ============================================================

# ---------- SENSORY HA ----------
sensor:
  # --- Diagnostyka (do analizy wydajnosci, widoczne w HA) ---
  - platform: debug
    free:
      name: "Debug Wolny heap"
    block:
      name: "Debug Najwiekszy blok heap"
    psram:
      name: "Debug Wolny PSRAM"
    loop_time:
      name: "Debug Czas petli"
  - platform: uptime
    name: "Debug Uptime"
    update_interval: 60s
  - platform: wifi_signal
    name: "Debug WiFi RSSI"
    update_interval: 60s

  # --- Salon ---
  - platform: homeassistant
    id: ha_power_salon
    entity_id: sensor.gnizdo_rybki_salon_power
    internal: true
    filters:
      - clamp: {min_value: 0, max_value: 200}
    on_value:
      - lvgl.label.update:
          id: salon_power_label
          text: !lambda 'return str_sprintf("%.0f W", x);'
      - lvgl.arc.update:
          id: salon_power_bar
          value: !lambda 'return (int)x;'
      - script.execute: update_summary

  - platform: homeassistant
    id: ha_energy_salon
    entity_id: sensor.gnizdo_rybki_salon_energy
    internal: true
    on_value:
      - lvgl.label.update:
          id: salon_energy_label
          text: !lambda 'return str_sprintf("%.1f kWh", x);'

  # --- Sypialnia ---
  - platform: homeassistant
    id: ha_power_sypialnia
    entity_id: sensor.gniazdo16w_power
    internal: true
    filters:
      - clamp: {min_value: 0, max_value: 200}
    on_value:
      - lvgl.label.update:
          id: sypialnia_power_label
          text: !lambda 'return str_sprintf("%.0f W", x);'
      - lvgl.arc.update:
          id: sypialnia_power_bar
          value: !lambda 'return (int)x;'
      - script.execute: update_summary

  - platform: homeassistant
    id: ha_energy_sypialnia
    entity_id: sensor.gniazdo16w_energy
    internal: true
    on_value:
      - lvgl.label.update:
          id: sypialnia_energy_label
          text: !lambda 'return str_sprintf("%.1f kWh", x);'

  # --- Kuchnia ---
  - platform: homeassistant
    id: ha_power_kuchnia
    entity_id: sensor.gniazdo20w_power
    internal: true
    filters:
      - clamp: {min_value: 0, max_value: 200}
    on_value:
      - lvgl.label.update:
          id: kuchnia_power_label
          text: !lambda 'return str_sprintf("%.0f W", x);'
      - lvgl.arc.update:
          id: kuchnia_power_bar
          value: !lambda 'return (int)x;'
      - script.execute: update_summary

  - platform: homeassistant
    id: ha_energy_kuchnia
    entity_id: sensor.gniazdo20w_energy
    internal: true
    on_value:
      - lvgl.label.update:
          id: kuchnia_energy_label
          text: !lambda 'return str_sprintf("%.1f kWh", x);'

  # --- Terrarium ---
  - platform: homeassistant
    id: ha_power_terrarium
    entity_id: sensor.gniazdo6_20w_power
    internal: true
    filters:
      - clamp: {min_value: 0, max_value: 200}
    on_value:
      - lvgl.label.update:
          id: terrarium_power_label
          text: !lambda 'return str_sprintf("%.0f W", x);'
      - lvgl.bar.update:
          id: terrarium_power_bar
          value: !lambda 'return (int)(x * 0.5f);'
      - script.execute: update_summary

  - platform: homeassistant
    id: ha_temp_terrarium
    entity_id: sensor.kanciapatemp_temperature
    internal: true
    on_value:
      - lvgl.label.update:
          id: terrarium_temp_label
          text: !lambda 'return str_sprintf("%.1f C", x);'
      - lvgl.label.update:
          id: terr_bubble_label
          text: !lambda 'return str_sprintf("%.1f C", x);'
      - script.execute: update_terrarium
      - script.execute: update_summary

  - platform: homeassistant
    id: ha_hum_terrarium
    entity_id: sensor.kanciapatemp_humidity
    internal: true
    on_value:
      - lvgl.label.update:
          id: terrarium_hum_label
          text: !lambda 'return str_sprintf("%.0f %%", x);'
      - script.execute: update_terrarium


  - platform: homeassistant
    id: ha_salon_player_vol
    entity_id: ${salon_player}
    attribute: volume_level
    internal: true
    on_value:
      - lvgl.bar.update:
          id: salon_vol_bar
          value: !lambda 'return std::isnan(x) ? 0 : (int)(x * 100);'
          animated: true

  - platform: homeassistant
    id: ha_sypialnia_player_vol
    entity_id: ${sypialnia_player}
    attribute: volume_level
    internal: true
    on_value:
      - lvgl.bar.update:
          id: sypialnia_vol_bar
          value: !lambda 'return std::isnan(x) ? 0 : (int)(x * 100);'
          animated: true

  - platform: homeassistant
    id: ha_weather_temp
    entity_id: ${weather_entity}
    attribute: temperature
    internal: true
    on_value:
      - lvgl.label.update:
          id: weather_temp
          text: !lambda 'return str_sprintf("%.1f C", x);'

  - platform: homeassistant
    id: ha_weather_wind
    entity_id: ${weather_entity}
    attribute: wind_speed
    internal: true
    on_value:
      - lvgl.label.update:
          id: wind_label
          text: !lambda 'return str_sprintf("%.0f km/h", x);'

  - platform: homeassistant
    id: ha_weather_humidity
    entity_id: ${weather_entity}
    attribute: humidity
    internal: true
    on_value:
      - lvgl.label.update:
          id: hum_out_label
          text: !lambda 'return str_sprintf("%.0f %%", x);'

# ---------- STANY PRZELACZNIKOW HA ----------
text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true

  - platform: homeassistant
    id: ha_salon_state
    entity_id: switch.gnizdo_rybki_salon
    internal: true
    on_value:
      - script.execute: update_summary
      - if:
          condition:
            lambda: 'return x == "on";'
          then:
            - lvgl.widget.update: {id: salon_toggle, state: {checked: true}}
            - lvgl.label.update: {id: salon_toggle_label, text: "ON"}
            - lvgl.widget.update: {id: sc_salon, bg_color: 0x4FC3F7}
            - lvgl.widget.update: {id: sc_salon_icon, text_color: 0x0A1030}
            - lvgl.widget.update: {id: salon_card, border_color: 0x4FC3F7, border_width: 2}
          else:
            - lvgl.widget.update: {id: salon_toggle, state: {checked: false}}
            - lvgl.label.update: {id: salon_toggle_label, text: "OFF"}
            - lvgl.widget.update: {id: sc_salon, bg_color: 0x1A2A63}
            - lvgl.widget.update: {id: sc_salon_icon, text_color: 0x8E9BC8}
            - lvgl.widget.update: {id: salon_card, border_color: 0x2C3858, border_width: 1}

  - platform: homeassistant
    id: ha_sypialnia_state
    entity_id: switch.gniazdo16w
    internal: true
    on_value:
      - script.execute: update_summary
      - if:
          condition:
            lambda: 'return x == "on";'
          then:
            - lvgl.widget.update: {id: sypialnia_toggle, state: {checked: true}}
            - lvgl.label.update: {id: sypialnia_toggle_label, text: "ON"}
            - lvgl.widget.update: {id: sc_sypialnia, bg_color: 0xB388FF}
            - lvgl.widget.update: {id: sc_sypialnia_icon, text_color: 0x0A1030}
            - lvgl.widget.update: {id: sypialnia_card, border_color: 0xB388FF, border_width: 2}
          else:
            - lvgl.widget.update: {id: sypialnia_toggle, state: {checked: false}}
            - lvgl.label.update: {id: sypialnia_toggle_label, text: "OFF"}
            - lvgl.widget.update: {id: sc_sypialnia, bg_color: 0x1A2A63}
            - lvgl.widget.update: {id: sc_sypialnia_icon, text_color: 0x8E9BC8}
            - lvgl.widget.update: {id: sypialnia_card, border_color: 0x2C3858, border_width: 1}

  - platform: homeassistant
    id: ha_kuchnia_state
    entity_id: switch.gniazdo20w
    internal: true
    on_value:
      - script.execute: update_summary
      - if:
          condition:
            lambda: 'return x == "on";'
          then:
            - lvgl.widget.update: {id: kuchnia_toggle, state: {checked: true}}
            - lvgl.label.update: {id: kuchnia_toggle_label, text: "ON"}
            - lvgl.widget.update: {id: sc_kuchnia, bg_color: 0xFFB74D}
            - lvgl.widget.update: {id: sc_kuchnia_icon, text_color: 0x0A1030}
            - lvgl.widget.update: {id: kuchnia_card, border_color: 0xFFB74D, border_width: 2}
          else:
            - lvgl.widget.update: {id: kuchnia_toggle, state: {checked: false}}
            - lvgl.label.update: {id: kuchnia_toggle_label, text: "OFF"}
            - lvgl.widget.update: {id: sc_kuchnia, bg_color: 0x1A2A63}
            - lvgl.widget.update: {id: sc_kuchnia_icon, text_color: 0x8E9BC8}
            - lvgl.widget.update: {id: kuchnia_card, border_color: 0x2C3858, border_width: 1}

  - platform: homeassistant
    id: ha_terrarium_state
    entity_id: switch.gniazdo6_20w
    internal: true
    on_value:
      - script.execute: update_summary
      - if:
          condition:
            lambda: 'return x == "on";'
          then:
            - lvgl.widget.update: {id: terrarium_toggle, state: {checked: true}}
            - lvgl.label.update: {id: terrarium_toggle_label, text: "ON"}
            - lvgl.widget.show: terrarium_ring
            - lvgl.widget.update: {id: sc_terrarium, bg_color: 0x66BB6A}
            - lvgl.widget.update: {id: sc_terrarium_icon, text_color: 0x0A1030}
            - lvgl.widget.update: {id: terrarium_card, border_color: 0x66BB6A, border_width: 2}
          else:
            - lvgl.widget.update: {id: terrarium_toggle, state: {checked: false}}
            - lvgl.label.update: {id: terrarium_toggle_label, text: "OFF"}
            - lvgl.widget.hide: terrarium_ring
            - lvgl.widget.update: {id: sc_terrarium, bg_color: 0x1A2A63}
            - lvgl.widget.update: {id: sc_terrarium_icon, text_color: 0x8E9BC8}
            - lvgl.widget.update: {id: terrarium_card, border_color: 0x2C3858, border_width: 1}


  - platform: homeassistant
    id: ha_salon_player_state
    entity_id: ${salon_player}
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return x == "playing";'
          then:
            - lvgl.label.update: {id: salon_play_label, text: "\U000F03E4"}
            - lvgl.widget.show: salon_eq
            - lvgl.widget.show: salon_media_ring
            - lvgl.widget.update: {id: salon_media_card, border_color: 0x4FC3F7, border_width: 2}
            - lambda: |-
                lv_anim_t a; lv_anim_init(&a);
                lv_anim_set_var(&a, id(eq_salon_0));
                lv_anim_set_values(&a, 4, 22);
                lv_anim_set_duration(&a, 380);
                lv_anim_set_reverse_duration(&a, 380);
                lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
                lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
                lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t) lv_obj_set_height);
                lv_anim_start(&a);
            - lambda: |-
                lv_anim_t a; lv_anim_init(&a);
                lv_anim_set_var(&a, id(eq_salon_1));
                lv_anim_set_values(&a, 4, 19);
                lv_anim_set_duration(&a, 520);
                lv_anim_set_reverse_duration(&a, 520);
                lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
                lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
                lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t) lv_obj_set_height);
                lv_anim_start(&a);
            - lambda: |-
                lv_anim_t a; lv_anim_init(&a);
                lv_anim_set_var(&a, id(eq_salon_2));
                lv_anim_set_values(&a, 4, 16);
                lv_anim_set_duration(&a, 660);
                lv_anim_set_reverse_duration(&a, 660);
                lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
                lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
                lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t) lv_obj_set_height);
                lv_anim_start(&a);
            - lambda: |-
                lv_anim_t a; lv_anim_init(&a);
                lv_anim_set_var(&a, id(eq_salon_3));
                lv_anim_set_values(&a, 4, 13);
                lv_anim_set_duration(&a, 800);
                lv_anim_set_reverse_duration(&a, 800);
                lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
                lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
                lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t) lv_obj_set_height);
                lv_anim_start(&a);
          else:
            - lvgl.label.update: {id: salon_play_label, text: "\U000F040A"}
            - lvgl.widget.hide: salon_eq
            - lvgl.widget.hide: salon_media_ring
            - lvgl.widget.update: {id: salon_media_card, border_color: 0x2C3858, border_width: 1}
            - lambda: 'lv_anim_delete(id(eq_salon_0), (lv_anim_exec_xcb_t) lv_obj_set_height); lv_obj_set_height(id(eq_salon_0), 4);'
            - lambda: 'lv_anim_delete(id(eq_salon_1), (lv_anim_exec_xcb_t) lv_obj_set_height); lv_obj_set_height(id(eq_salon_1), 4);'
            - lambda: 'lv_anim_delete(id(eq_salon_2), (lv_anim_exec_xcb_t) lv_obj_set_height); lv_obj_set_height(id(eq_salon_2), 4);'
            - lambda: 'lv_anim_delete(id(eq_salon_3), (lv_anim_exec_xcb_t) lv_obj_set_height); lv_obj_set_height(id(eq_salon_3), 4);'

  - platform: homeassistant
    id: ha_salon_player_title
    entity_id: ${salon_player}
    attribute: media_title
    internal: true
    on_value:
      - lvgl.label.update:
          id: salon_title_label
          text: !lambda 'return x.empty() ? std::string("Brak odtwarzania") : x;'

  - platform: homeassistant
    id: ha_sypialnia_player_state
    entity_id: ${sypialnia_player}
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return x == "playing";'
          then:
            - lvgl.label.update: {id: sypialnia_play_label, text: "\U000F03E4"}
            - lvgl.widget.show: sypialnia_eq
            - lvgl.widget.show: sypialnia_media_ring
            - lvgl.widget.update: {id: sypialnia_media_card, border_color: 0xB388FF, border_width: 2}
            - lambda: |-
                lv_anim_t a; lv_anim_init(&a);
                lv_anim_set_var(&a, id(eq_sypialnia_0));
                lv_anim_set_values(&a, 4, 22);
                lv_anim_set_duration(&a, 380);
                lv_anim_set_reverse_duration(&a, 380);
                lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
                lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
                lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t) lv_obj_set_height);
                lv_anim_start(&a);
            - lambda: |-
                lv_anim_t a; lv_anim_init(&a);
                lv_anim_set_var(&a, id(eq_sypialnia_1));
                lv_anim_set_values(&a, 4, 19);
                lv_anim_set_duration(&a, 520);
                lv_anim_set_reverse_duration(&a, 520);
                lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
                lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
                lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t) lv_obj_set_height);
                lv_anim_start(&a);
            - lambda: |-
                lv_anim_t a; lv_anim_init(&a);
                lv_anim_set_var(&a, id(eq_sypialnia_2));
                lv_anim_set_values(&a, 4, 16);
                lv_anim_set_duration(&a, 660);
                lv_anim_set_reverse_duration(&a, 660);
                lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
                lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
                lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t) lv_obj_set_height);
                lv_anim_start(&a);
            - lambda: |-
                lv_anim_t a; lv_anim_init(&a);
                lv_anim_set_var(&a, id(eq_sypialnia_3));
                lv_anim_set_values(&a, 4, 13);
                lv_anim_set_duration(&a, 800);
                lv_anim_set_reverse_duration(&a, 800);
                lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
                lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
                lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t) lv_obj_set_height);
                lv_anim_start(&a);
          else:
            - lvgl.label.update: {id: sypialnia_play_label, text: "\U000F040A"}
            - lvgl.widget.hide: sypialnia_eq
            - lvgl.widget.hide: sypialnia_media_ring
            - lvgl.widget.update: {id: sypialnia_media_card, border_color: 0x2C3858, border_width: 1}
            - lambda: 'lv_anim_delete(id(eq_sypialnia_0), (lv_anim_exec_xcb_t) lv_obj_set_height); lv_obj_set_height(id(eq_sypialnia_0), 4);'
            - lambda: 'lv_anim_delete(id(eq_sypialnia_1), (lv_anim_exec_xcb_t) lv_obj_set_height); lv_obj_set_height(id(eq_sypialnia_1), 4);'
            - lambda: 'lv_anim_delete(id(eq_sypialnia_2), (lv_anim_exec_xcb_t) lv_obj_set_height); lv_obj_set_height(id(eq_sypialnia_2), 4);'
            - lambda: 'lv_anim_delete(id(eq_sypialnia_3), (lv_anim_exec_xcb_t) lv_obj_set_height); lv_obj_set_height(id(eq_sypialnia_3), 4);'

  - platform: homeassistant
    id: ha_sypialnia_player_title
    entity_id: ${sypialnia_player}
    attribute: media_title
    internal: true
    on_value:
      - lvgl.label.update:
          id: sypialnia_title_label
          text: !lambda 'return x.empty() ? std::string("Brak odtwarzania") : x;'

  - platform: homeassistant
    id: ha_weather_state
    entity_id: ${weather_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: weather_icon
          text: !lambda |-
            if (x == "sunny") return "\U000F0599";
            if (x == "clear-night") return "\U000F0594";
            if (x == "partlycloudy") return "\U000F0595";
            if (x == "cloudy") return "\U000F0590";
            if (x == "rainy") return "\U000F0597";
            if (x == "pouring") return "\U000F0596";
            if (x == "snowy" || x == "snowy-rainy") return "\U000F0598";
            if (x == "fog") return "\U000F0591";
            if (x == "lightning" || x == "lightning-rainy") return "\U000F0593";
            if (x == "windy" || x == "windy-variant") return "\U000F059D";
            return "\U000F0590";

# ---------- CZCIONKI ----------
font:
  - file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: mdi_big
    size: 38
    bpp: 4
    glyphs: ["\U000F04B9", "\U000F02E3", "\U000F0B7C", "\U000F023A", "\U000F050F", "\U000F058E", "\U000F04C3"]
  - file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: mdi_small
    size: 22
    bpp: 4
