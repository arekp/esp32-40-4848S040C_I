                id: nav_btn0
                align: LEFT_MID
                x: 14
                width: 86
                height: 40
                bg_color: 0x1E2A4A
                radius: 20
                border_width: 1
                border_color: 0x3B5BDB
                shadow_width: 0
                widgets:
                  - label:
                      align: CENTER
                      text_font: mdi_small
                      text_color: 0xDCE3F7
                      text: "\U000F02DC"
                on_click:
                  - lvgl.page.show: {id: clock_page, animation: FADE_IN, time: 250ms}
                  - script.execute: {id: nav_select, idx: 0}

            - button:
