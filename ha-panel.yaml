# ---------- WYSWIETLACZ ST7701S ----------
display:
  - platform: st7701s
    id: tft_display
    update_interval: never
    auto_clear_enabled: false
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    cs_pin: GPIO39
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    data_pins:
      red:   [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue:  [4, 5, 6, 7, 15]

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display

# ---------- SKRYPTY ----------
script:
  - id: update_clock
    then:
      - if:
          condition:
            lambda: 'return id(ha_time).now().is_valid();'
          then:
            - lvgl.label.update:
                id: clock_label
                text: !lambda 'return id(ha_time).now().strftime("%H:%M");'
            - lvgl.label.update:
                id: dim_clock_label
                text: !lambda 'return id(ha_time).now().strftime("%H:%M");'
            - lambda: |-
                static const char *dn[] = {"Niedziela", "Poniedzialek", "Wtorek", "Sroda", "Czwartek", "Piatek", "Sobota"};
                static const char *mn[] = {"stycznia", "lutego", "marca", "kwietnia", "maja", "czerwca", "lipca", "sierpnia", "wrzesnia", "pazdziernika", "listopada", "grudnia"};
                auto t = id(ha_time).now();
                std::string d = str_sprintf("%s, %d %s", dn[t.day_of_week - 1], t.day_of_month, mn[t.month - 1]);
                lv_label_set_text(id(date_label), d.c_str());
                lv_label_set_text(id(dim_info_label), d.c_str());
                // wygaszacz: co minute przesuwa zegar, zeby IPS sie nie wypalal
                lv_obj_align(id(dim_box), LV_ALIGN_CENTER, ((t.minute * 37) % 81) - 40, ((t.minute * 23) % 101) - 50);

  # Podsumowanie na zegarze i kafelku "Razem": moc, liczba wlaczonych gniazdek, status
  - id: update_summary
    then:
      - lambda: |-
          float p[4] = {id(ha_power_salon).state, id(ha_power_sypialnia).state,
                        id(ha_power_kuchnia).state, id(ha_power_terrarium).state};
          std::string s[4] = {id(ha_salon_state).state, id(ha_sypialnia_state).state,
                              id(ha_kuchnia_state).state, id(ha_terrarium_state).state};
          float total = 0;
          int on = 0;
          for (int i = 0; i < 4; i++) {
            if (!std::isnan(p[i])) total += p[i];
            if (s[i] == "on") on++;
          }
          std::string pw = str_sprintf("Razem %.0f W", total);
          std::string sk = str_sprintf("Gniazdka %d/4", on);
          lv_label_set_text(id(pill_power_label), pw.c_str());
          lv_label_set_text(id(pill_sockets_label), sk.c_str());
          std::string tw = str_sprintf("%.0f W", total);
          std::string tc = str_sprintf("%d/4 wlaczone", on);
          lv_label_set_text(id(total_power_label), tw.c_str());
          lv_label_set_text(id(total_count_label), tc.c_str());

          float t = id(ha_temp_terrarium).state;
          bool bad = !std::isnan(t) && (t < ${terrarium_temp_min} || t > ${terrarium_temp_max});
          std::string st = bad ? "Terrarium: temperatura poza zakresem" : "Wszystko w normie";
          uint32_t col = bad ? 0xEF5350 : 0x2ECC8F;
          lv_label_set_text(id(status_label), st.c_str());
          lv_label_set_text(id(status_icon), bad ? "\U000F0026" : "\U000F05E0");
          lv_obj_set_style_text_color(id(status_icon), lv_color_hex(col), 0);
          lv_obj_set_style_border_color(id(status_pill), lv_color_hex(col), 0);
          lv_obj_set_style_bg_color(id(status_pill), lv_color_hex(bad ? 0x4A1C22 : 0x0E3B36), 0);

  # Wskazniki (arc) temperatury i wilgotnosci na stronie terrarium
  - id: update_terrarium
    then:
      - lambda: |-
          float t = id(ha_temp_terrarium).state;
          float h = id(ha_hum_terrarium).state;
          if (!std::isnan(t)) {
            lv_arc_set_value(id(terrarium_temp_arc), (int) (t * 10));
            bool low = t < ${terrarium_temp_min};
            bool high = t > ${terrarium_temp_max};
            lv_color_t c = lv_color_hex((low || high) ? 0xEF5350 : 0x66BB6A);
            lv_obj_set_style_arc_color(id(terrarium_temp_arc), c, LV_PART_INDICATOR);
            lv_obj_set_style_text_color(id(terrarium_temp_label), c, 0);
            lv_label_set_text(id(terrarium_temp_status), low ? "Za zimno" : (high ? "Za cieplo" : "W zakresie"));
          }
          if (!std::isnan(h)) {
            lv_arc_set_value(id(terrarium_hum_arc), (int) h);
          }

  - id: nav_select
    parameters:
      idx: int
    then:
      - lambda: |-
          lv_obj_t *b[5] = {id(nav_btn0), id(nav_btn1), id(nav_btn2), id(nav_btn3), id(nav_btn4)};
          for (int i = 0; i < 5; i++) {
            bool on = (i == idx);
            lv_obj_set_style_bg_color(b[i], lv_color_hex(on ? 0x1E2A4A : 0x1B2338), 0);
            lv_obj_set_style_border_width(b[i], on ? 1 : 0, 0);
            lv_obj_set_style_border_color(b[i], lv_color_hex(0x3B5BDB), 0);
          }

  - id: toggle_salon
    then:
      - if:
          condition:
            lambda: 'return lv_obj_has_state(id(salon_toggle), LV_STATE_CHECKED);'
          then:
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: switch.gnizdo_rybki_salon
          else:
            - homeassistant.service:
                service: switch.turn_off
                data:
                  entity_id: switch.gnizdo_rybki_salon

  - id: toggle_sypialnia
    then:
      - if:
          condition:
            lambda: 'return lv_obj_has_state(id(sypialnia_toggle), LV_STATE_CHECKED);'
          then:
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: switch.gniazdo16w
          else:
            - homeassistant.service:
                service: switch.turn_off
                data:
                  entity_id: switch.gniazdo16w

  - id: toggle_terrarium
    then:
      - if:
          condition:
            lambda: 'return lv_obj_has_state(id(terrarium_toggle), LV_STATE_CHECKED);'
          then:
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: switch.gniazdo6_20w
          else:
            - homeassistant.service:
                service: switch.turn_off
                data:
                  entity_id: switch.gniazdo6_20w

  - id: toggle_kuchnia
    then:
      - if:
          condition:
            lambda: 'return lv_obj_has_state(id(kuchnia_toggle), LV_STATE_CHECKED);'
          then:
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: switch.gniazdo20w
          else:
            - homeassistant.service:
                service: switch.turn_off
                data:
                  entity_id: switch.gniazdo20w

# ============================================================
# LVGL UI
# Strony: Zegar (home) | Multimedia | Energia | Terrarium | Ustawienia
# + Wygaszacz (dim_page) wlaczany po bezczynnosci
# Paleta: tlo 0x0F1424 | karta 0x1B2338 | zegar: granat 0x070B24..0x16215A
#   Salon 0x4FC3F7 (cyjan) | Sypialnia 0xB388FF (fiolet) | Kuchnia 0xFFB74D (bursztyn)
#   Terrarium 0x66BB6A (zielony)
# ============================================================
lvgl:
  displays:
    - tft_display
  touchscreens:
    - tft_touch

  log_level: WARN
  color_depth: 16
  buffer_size: 25%

  bg_color: 0x0F1424
  default_font: font_nav

  # Po bezczynnosci: wygaszacz (przyciemniony zegar), albo powrot na zegar gdy wylaczony w ustawieniach
  on_idle:
    timeout: 60s
    then:
      - if:
          condition:
            lambda: 'return id(screensaver_on);'
          then:
            - lvgl.page.show: {id: dim_page, animation: FADE_IN, time: 500ms}
            - lvgl.widget.hide: nav_bar
            - light.turn_on:
                id: display_backlight
                brightness: 5%
                transition_length: 0s
          else:
            - lvgl.page.show: {id: clock_page, animation: FADE_IN, time: 300ms}
            - script.execute: {id: nav_select, idx: 0}

  # Dolny pasek nawigacji
  top_layer:
    widgets:
      - obj:
          id: nav_bar
          align: BOTTOM_MID
          width: 480
          height: 58
          bg_color: 0x0A0E1A
          border_width: 0
          pad_all: 0
          radius: 0
          widgets:
