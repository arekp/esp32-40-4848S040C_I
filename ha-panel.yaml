    size: 16
    bpp: 4

# ---------- WYSWIETLACZ ST7701S ----------
display:
  - platform: st7701s
    id: tft_display
    update_interval: never
    auto_clear_enabled: false
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    cs_pin: GPIO39
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    data_pins:
      red:   [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue:  [4, 5, 6, 7, 15]

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display

# ---------- SKRYPTY ----------
script:
  - id: update_clock
    then:
      - if:
          condition:
            lambda: 'return id(ha_time).now().is_valid();'
          then:
            - lvgl.label.update:
                id: clock_label
                text: !lambda 'return id(ha_time).now().strftime("%H:%M");'

  - id: nav_select
    parameters:
      idx: int
    then:
      - lambda: |-
          lv_obj_t *b[4] = {id(nav_btn0), id(nav_btn1), id(nav_btn2), id(nav_btn3)};
          for (int i = 0; i < 4; i++) {
            bool on = (i == idx);
            lv_obj_set_style_bg_color(b[i], lv_color_hex(on ? 0x1E2A4A : 0x1B2338), 0);
            lv_obj_set_style_border_width(b[i], on ? 1 : 0, 0);
            lv_obj_set_style_border_color(b[i], lv_color_hex(0x3B5BDB), 0);
          }

  - id: toggle_salon
    then:
      - if:
          condition:
            lambda: 'return lv_obj_has_state(id(salon_toggle), LV_STATE_CHECKED);'
          then:
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: switch.gnizdo_rybki_salon
          else:
            - homeassistant.service:
                service: switch.turn_off
                data:
                  entity_id: switch.gnizdo_rybki_salon

  - id: toggle_sypialnia
    then:
      - if:
          condition:
            lambda: 'return lv_obj_has_state(id(sypialnia_toggle), LV_STATE_CHECKED);'
          then:
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: switch.gniazdo16w
          else:
            - homeassistant.service:
                service: switch.turn_off
                data:
                  entity_id: switch.gniazdo16w

  - id: toggle_terrarium
    then:
      - if:
          condition:
            lambda: 'return lv_obj_has_state(id(terrarium_toggle), LV_STATE_CHECKED);'
          then:
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: switch.gniazdo6_20w
          else:
            - homeassistant.service:
                service: switch.turn_off
                data:
                  entity_id: switch.gniazdo6_20w

  - id: toggle_kuchnia
    then:
      - if:
          condition:
            lambda: 'return lv_obj_has_state(id(kuchnia_toggle), LV_STATE_CHECKED);'
          then:
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: switch.gniazdo20w
          else:
            - homeassistant.service:
                service: switch.turn_off
                data:
                  entity_id: switch.gniazdo20w

